name: Deploy

# The site renders the docs and images of Shady, shady-shell, shady-greeter,
# Gloam and the Afterglow and Horizon rices, from their main branches. A
# change here deploys on push; a change there on the daily run, or right away
# by running this workflow by hand.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout shady
        uses: actions/checkout@v4
        with:
          repository: gloaming-dusk/shady
          path: shady

      - name: Checkout shady-shell
        uses: actions/checkout@v4
        with:
          repository: gloaming-dusk/shady-shell
          path: shady-shell

      - name: Checkout shady-greeter
        uses: actions/checkout@v4
        with:
          repository: gloaming-dusk/shady-greeter
          path: shady-greeter

      - name: Checkout gloam
        uses: actions/checkout@v4
        with:
          repository: gloaming-dusk/gloam
          path: gloam

      - name: Checkout shady-rice-afterglow
        uses: actions/checkout@v4
        with:
          repository: gloaming-dusk/shady-rice-afterglow
          path: shady-rice-afterglow

      - name: Checkout shady-rice-horizon
        uses: actions/checkout@v4
        with:
          repository: gloaming-dusk/shady-rice-horizon
          path: shady-rice-horizon

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Astro site
        run: npm run check

      - name: Build static site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
